<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="removal-title removal-desc">
  <title id="removal-title">Google review removal case-strength guide</title>
  <desc id="removal-desc">Strong removal signals include fake engagement, conflicts of interest, harassment, personal information, spam and off-topic content. Direct links, complete screenshots, dated records and prior report references help build a focused case.</desc>
  <rect width="1200" height="675" rx="24" fill="#f8fafc"/>
  <text x="60" y="67" fill="#16223b" font-family="Georgia, serif" font-size="39">What strengthens a Google review removal case?</text>
  <text x="60" y="105" fill="#536176" font-family="Arial, Helvetica, sans-serif" font-size="20">Build the clearest case around the review, its context and supporting evidence</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="145" width="520" height="355" rx="15" fill="#eef8f3" stroke="#b8dfcd"/>
    <rect x="620" y="145" width="520" height="355" rx="15" fill="#f1f5fb" stroke="#c7d5e8"/>
    <text x="90" y="194" fill="#0f6741" font-size="24">Strong removal signals</text>
    <text x="650" y="194" fill="#284d78" font-size="24">Evidence that strengthens the case</text>
    <g fill="#244236" font-size="19"><text x="90" y="246">✓ No genuine customer experience</text><text x="90" y="291">✓ Competitor or employee conflict</text><text x="90" y="336">✓ Harassment, threats or hate speech</text><text x="90" y="381">✓ Non-public personal information</text><text x="90" y="426">✓ Spam, promotion or off-topic content</text><text x="90" y="471">✓ Repeated or duplicated submissions</text></g>
    <g fill="#314c6d" font-size="19"><text x="650" y="246">✓ Direct review link and full screenshot</text><text x="650" y="291">✓ Publication date and matching records</text><text x="650" y="336">✓ Evidence of a competitor connection</text><text x="650" y="381">✓ Copies of duplicated review content</text><text x="650" y="426">✓ Previous report or case reference</text><text x="650" y="471">✓ A concise timeline and clear context</text></g>
  </g>
  <path d="M110 555h210l25 26 25-26h210l25 26 25-26h210l25 26 25-26h210" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <g fill="#16223b" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle"><text x="215" y="545">1. Capture the review</text><text x="475" y="545">2. Identify the concern</text><text x="735" y="545">3. Organize the evidence</text><text x="995" y="545">4. Follow the case</text></g>
  <text x="60" y="623" fill="#536176" font-family="Arial, Helvetica, sans-serif" font-size="16">Selective screening focuses every accepted case on its strongest path to removal.</text>
  <text x="1140" y="648" fill="#b81722" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end">ReviewsBoost</text>
</svg>
