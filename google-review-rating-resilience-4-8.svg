<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">One-star ratings required to lower an exact 4.8 average by at least 0.1 points</title>
  <desc id="desc">Horizontal bars show that profiles starting with 10, 20, 50, 100, 200, 500 and 1,000 reviews require 1, 1, 2, 3, 6, 14 and 28 incoming one-star ratings respectively.</desc>
  <rect width="1200" height="675" rx="24" fill="#f2f7fd"/>
  <text x="58" y="66" fill="#10233f" font-family="Georgia,serif" font-size="38">How review count buffers a 4.8-star average</text>
  <text x="58" y="103" fill="#435571" font-family="Arial,sans-serif" font-size="20">Minimum incoming 1-star ratings for an exact decline of at least 0.1 points</text>

  <g font-family="Arial,sans-serif" font-size="17" fill="#253a56">
    <text x="62" y="174">10 reviews</text>
    <text x="62" y="229">20 reviews</text>
    <text x="62" y="284">50 reviews</text>
    <text x="62" y="339">100 reviews</text>
    <text x="62" y="394">200 reviews</text>
    <text x="62" y="449">500 reviews</text>
    <text x="62" y="504">1,000 reviews</text>
  </g>

  <g fill="#d4e3f3">
    <rect x="220" y="150" width="760" height="30" rx="6"/>
    <rect x="220" y="205" width="760" height="30" rx="6"/>
    <rect x="220" y="260" width="760" height="30" rx="6"/>
    <rect x="220" y="315" width="760" height="30" rx="6"/>
    <rect x="220" y="370" width="760" height="30" rx="6"/>
    <rect x="220" y="425" width="760" height="30" rx="6"/>
    <rect x="220" y="480" width="760" height="30" rx="6"/>
  </g>
  <g fill="#087fe8">
    <rect x="220" y="150" width="25" height="30" rx="6"/>
    <rect x="220" y="205" width="25" height="30" rx="6"/>
    <rect x="220" y="260" width="50" height="30" rx="6"/>
    <rect x="220" y="315" width="75" height="30" rx="6"/>
    <rect x="220" y="370" width="150" height="30" rx="6"/>
    <rect x="220" y="425" width="350" height="30" rx="6"/>
    <rect x="220" y="480" width="700" height="30" rx="6"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233f">
    <text x="258" y="173">1</text>
    <text x="258" y="228">1</text>
    <text x="283" y="283">2</text>
    <text x="308" y="338">3</text>
    <text x="383" y="393">6</text>
    <text x="583" y="448">14</text>
    <text x="933" y="503">28</text>
  </g>

  <rect x="58" y="550" width="1084" height="78" rx="12" fill="#ffffff" stroke="#cbdced"/>
  <text x="82" y="584" fill="#10233f" font-family="Arial,sans-serif" font-size="18">Formula: m = ceiling[dN ÷ (R − 1 − d)] · R = 4.8 · d = 0.1</text>
  <text x="82" y="611" fill="#566983" font-family="Arial,sans-serif" font-size="15">Exact-average model; it does not predict Google’s displayed rounding, publication timing or moderation decisions.</text>
  <text x="1032" y="651" fill="#0870d1" font-family="Arial,sans-serif" font-size="15">ReviewsBoost</text>
</svg>
